services:
  translate-service:
    image: translate-service:latest
    restart: always
    ports:
      - "8700:8700"

    volumes:
      - traductor-files:/srv/data
      - ./models-data:/srv/models:ro

    environment:
        CTRANSLATE_BEAM_SIZE: 2
        CTRANSLATE_INTER_THREADS: 1
        CTRANSLATE_INTRA_THREADS: 6

  translate-batch:
    image: translate-batch:latest
    restart: always

    volumes:
      - traductor-files:/srv/data
      - ./models-data:/srv/models:ro

# Compose creates a default network automatically, so nothing extra is needed.
# In production the services join a shared external network. To do the same,
# uncomment the block below (and create it once: docker network create softcatala):
#
# networks:
#   default:
#     name: softcatala
#     external: true

volumes:
  traductor-files:
